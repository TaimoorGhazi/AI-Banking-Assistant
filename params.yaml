# Hyperparameters for DVC pipeline and experiments
# Referenced by dvc.yaml stages

preprocessing:
  chunk_size: 512
  chunk_overlap: 50

retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 5

finetuning:
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 0.0002
  num_epochs: 3
  batch_size: 4
