model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  device: cpu
  max_tokens: 512
  temperature: 0.7
  generation_max_time: 45
  top_p: 0.9
  quantization_bits: 4
  quantization_type: nf4
  compute_dtype: float16

runtime:
  mode: cpu_local
  profiles:
    cpu_local:
      model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
      device: cpu
      use_quantization: false
      load_adapter: false
    gpu_adapter:
      model_name: meta-llama/Llama-3.2-3B-Instruct
      device: cuda
      use_quantization: true
      load_adapter: true

finetuning:
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 0.0002
  num_epochs: 3
  batch_size: 1
  max_seq_length: 512
  gradient_accumulation_steps: 8
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

mlops:
  experiment_name: AI-Banking-Assistant
