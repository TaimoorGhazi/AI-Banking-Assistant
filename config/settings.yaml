app:
  name: "AI Banking Assistant"
  version: "0.1.0"
  debug: false

model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  device: "cpu"
  max_tokens: 256
  temperature: 0.5

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 256
  chunk_overlap: 25
  top_k: 3

guardrails:
  enable_input_filter: true
  enable_pii_detection: true
  max_input_length: 1024

api:
  host: "127.0.0.1"
  port: 8000

logging:
  level: "DEBUG"
  log_file: "logs/app.log"
