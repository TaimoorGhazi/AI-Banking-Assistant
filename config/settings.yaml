app:
  name: "AI Banking Assistant"
  version: "0.1.0"
  debug: false

model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  device: "cuda"
  max_tokens: 512
  temperature: 0.7

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  chunk_size: 512
  chunk_overlap: 50
  top_k: 5

finetuning:
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 0.0002
  num_epochs: 3
  batch_size: 4

guardrails:
  enable_input_filter: true
  enable_pii_detection: true
  max_input_length: 2048

api:
  host: "0.0.0.0"
  port: 8000
  rate_limit_per_minute: 10

logging:
  level: "INFO"
  log_file: "logs/app.log"
