  #   cmd: python -m src.AI_Banking_Assistant.llm.finetuning.train
  #   deps:
  #     - src/AI_Banking_Assistant/llm/finetuning/train.py
  #     - data/finetune/train.jsonl
  #   outs:
  #     - src/AI_Banking_Assistant/llm/finetuning/output/lora_adapter/
  #   params:
  #     - finetuning.lora_rank
  #     - finetuning.learning_rate
  #     - finetuning.num_epochs
